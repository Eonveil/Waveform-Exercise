<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wavesurfer.js Audio Player</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }
    #waveform {
      margin-top: 1rem;
      margin-bottom: 2rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
    }
    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      background-color: #4F4A85;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background-color: #383351;
    }
  </style>
</head>
<body>
  <h1>Wavesurfer.js Basic Audio Player</h1>
  <p>Click the play button or the waveform to play the audio.</p>

  <div class="controls">
    <button id="playBtn">Play</button>
  </div>

  <div id="waveform"></div>

  <!-- Include Wavesurfer.js from CDN -->
  <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>

  <!-- Include our custom player script -->
  <script src="player.js"></script>
</body>
</html>
